services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: owidimporter:latest
    container_name: owidimporter
    network_mode: host
    # ports:
    #   - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    restart: unless-stopped
  nginx:
    image: nginx:alpine
    container_name: owidimporter-nginx
    network_mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped